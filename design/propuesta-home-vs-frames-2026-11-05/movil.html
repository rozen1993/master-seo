<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0b0c}iframe{border:0;width:390px;display:block}</style></head>
<body><iframe id="f" src="home.html"></iframe>
<script>const f=document.getElementById('f');f.onload=()=>{const d=f.contentDocument;d.fonts.ready.then(()=>{setTimeout(()=>{const h=d.documentElement.scrollHeight;f.style.height=h+'px';document.body.setAttribute('data-h',h);},300)})};</script></body></html>
